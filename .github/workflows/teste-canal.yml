name: Boas-vindas no canal do Telegram

# Aplica foto e descrição no canal e, se pedido, publica as boas-vindas.
on:
  workflow_dispatch:
    inputs:
      so_visual:
        description: "Só aplicar foto e descrição (sem publicar boas-vindas)"
        type: boolean
        default: true

jobs:
  canal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL_ID: ${{ secrets.TELEGRAM_CANAL_ID }}
        run: python -m radar teste-canal ${{ inputs.so_visual && '--so-visual' || '' }}
