name: Testar publicação nas redes

# Publica UM post de teste (resumo com títulos reais) em Threads/Instagram/X,
# apenas nas redes que já têm secrets configurados.
on:
  workflow_dispatch:
    inputs:
      redes:
        description: "Redes a testar (ex.: instagram ou threads,x). 'todas' = todas com secrets"
        default: "todas"
      reel:
        description: "Testar só o Reel do Instagram (publica de verdade)"
        type: boolean
        default: false

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIDIA_TOKEN: ${{ secrets.MIDIA_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SO_REDES: ${{ inputs.redes }}
        run: |
          if [ "${{ inputs.reel }}" = "true" ]; then python -m radar testar-reel; else python -m radar testar-redes; fi
