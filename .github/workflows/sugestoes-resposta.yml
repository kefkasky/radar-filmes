name: Sugestões de resposta

# Todo dia por volta das 11h45: posts em alta no X sobre as novidades do
# streaming, com resposta sugerida, no seu Telegram. O robô não responde
# sozinho; você responde manualmente.
on:
  schedule:
    - cron: "43 14 * * *"
  workflow_dispatch: {}

jobs:
  sugestoes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python -m radar sugestoes
